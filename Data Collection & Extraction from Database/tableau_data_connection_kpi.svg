<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="kpiShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- TABLEAU WORKSPACE HEADER -->
  <rect x="30" y="25" width="940" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="45" y="38" width="24" height="24" rx="4" fill="#e97125"/>
  <text x="57" y="55" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">T</text>
  <text x="80" y="55" fill="#f8fafc" font-size="15" font-weight="700">Tableau Data Source: smart_healthcare_dataset.csv</text>
  <rect x="790" y="38" width="160" height="25" rx="4" fill="#0f172a" stroke="#10b981"/>
  <circle cx="805" cy="50" r="4" fill="#10b981"/>
  <text x="815" y="54" fill="#10b981" font-size="11" font-weight="600">Extract Connected</text>

  <!-- LEFT: DATA CONNECTION & SCHEMA SUMMARY -->
  <g transform="translate(30, 95)">
    <rect width="450" height="475" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="14" font-weight="700">Tableau Data Connection &amp; Schema</text>
    <text x="25" y="55" fill="#94a3b8" font-size="11">17 Columns • 5,000 Records • Zero Truncation</text>

    <!-- Schema Table Header -->
    <rect x="25" y="75" width="400" height="28" rx="4" fill="#0f172a"/>
    <text x="35" y="93" fill="#64748b" font-size="10" font-weight="700" text-transform="uppercase">Type</text>
    <text x="85" y="93" fill="#64748b" font-size="10" font-weight="700" text-transform="uppercase">Field Name</text>
    <text x="280" y="93" fill="#64748b" font-size="10" font-weight="700" text-transform="uppercase">Tableau Role</text>
    <text x="375" y="93" fill="#64748b" font-size="10" font-weight="700" text-transform="uppercase">Status</text>

    <!-- Schema Rows -->
    <g font-size="10" fill="#cbd5e1">
      <!-- Row 1 -->
      <text x="35" y="122" fill="#38bdf8" font-weight="bold">Abc</text>
      <text x="85" y="122">patient_id</text>
      <text x="280" y="122" fill="#94a3b8">Dimension (PK)</text>
      <text x="375" y="122" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 2 -->
      <text x="35" y="146" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="146">age</text>
      <text x="280" y="146" fill="#94a3b8">Measure (18-79)</text>
      <text x="375" y="146" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 3 -->
      <text x="35" y="170" fill="#38bdf8" font-weight="bold">Abc</text>
      <text x="85" y="170">gender</text>
      <text x="280" y="170" fill="#94a3b8">Dimension</text>
      <text x="375" y="170" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 4 -->
      <text x="35" y="194" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="194">bmi</text>
      <text x="280" y="194" fill="#94a3b8">Measure (15.0-42.6)</text>
      <text x="375" y="194" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 5 -->
      <text x="35" y="218" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="218">exercise_level</text>
      <text x="280" y="218" fill="#94a3b8">Measure (0, 1, 2)</text>
      <text x="375" y="218" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 6 -->
      <text x="35" y="242" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="242">smoking / alcohol</text>
      <text x="280" y="242" fill="#94a3b8">Measure (Binary)</text>
      <text x="375" y="242" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 7 -->
      <text x="35" y="266" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="266">blood_pressure</text>
      <text x="280" y="266" fill="#94a3b8">Measure (90-179)</text>
      <text x="375" y="266" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 8 -->
      <text x="35" y="290" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="290">cholesterol / glucose</text>
      <text x="280" y="290" fill="#94a3b8">Measures</text>
      <text x="375" y="290" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 9 -->
      <text x="35" y="314" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="314">fatigue / chest / dizziness</text>
      <text x="280" y="314" fill="#94a3b8">Measures (Symptoms)</text>
      <text x="375" y="314" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 10 -->
      <text x="35" y="338" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="338">heart_disease / diab / stroke</text>
      <text x="280" y="338" fill="#94a3b8">Measures (Chronic)</text>
      <text x="375" y="338" fill="#10b981" font-weight="bold">✓ 100%</text>

      <!-- Row 11 -->
      <text x="35" y="362" fill="#34d399" font-weight="bold">#</text>
      <text x="85" y="362">health_risk_score</text>
      <text x="280" y="362" fill="#94a3b8">Measure (Score)</text>
      <text x="375" y="362" fill="#10b981" font-weight="bold">✓ 100%</text>
    </g>

    <rect x="25" y="390" width="400" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="35" y="413" fill="#10b981" font-size="11" font-weight="bold">Ingestion Audit Result:</text>
    <text x="35" y="432" fill="#94a3b8" font-size="10">80,000 data cells imported. 0 null values. 0 truncated strings.</text>
  </g>

  <!-- RIGHT: THE VERIFICATION KPI CARD -->
  <g transform="translate(510, 95)">
    <!-- Main Big Verification Card -->
    <rect width="460" height="260" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#kpiShadow)"/>
    
    <rect x="30" y="25" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.15"/>
    <text x="95" y="41" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" text-transform="uppercase">Integrity Check</text>

    <text x="30" y="80" fill="#94a3b8" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="1">Count of Patients (Verification KPI)</text>
    
    <!-- Big 5,000 Display -->
    <text x="30" y="165" fill="#f8fafc" font-size="80" font-weight="900" letter-spacing="-2">5,000</text>
    <circle cx="340" cy="135" r="28" fill="#10b981" fill-opacity="0.2"/>
    <path d="M328 135 L336 143 L353 126" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="30" y1="195" x2="430" y2="195" stroke="#334155" stroke-width="1"/>

    <text x="30" y="222" fill="#10b981" font-size="12" font-weight="700">✓ 100.0% Complete Cohort Verified</text>
    <text x="30" y="240" fill="#94a3b8" font-size="11">Tableau Calculation: <tspan font-family="monospace" fill="#38bdf8">COUNT([patient_id]) = 5,000</tspan></text>

    <!-- Secondary Validation Cards -->
    <g transform="translate(0, 280)">
      <rect width="215" height="195" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-size="10" font-weight="600" text-transform="uppercase">Total Fields Loaded</text>
      <text x="20" y="70" fill="#38bdf8" font-size="36" font-weight="800">17</text>
      <text x="20" y="95" fill="#e2e8f0" font-size="11" font-weight="600">Columns Mapped</text>
      <text x="20" y="115" fill="#94a3b8" font-size="10">Demographics: 3</text>
      <text x="20" y="132" fill="#94a3b8" font-size="10">Lifestyle Habits: 3</text>
      <text x="20" y="149" fill="#94a3b8" font-size="10">Clinical Vitals: 3</text>
      <text x="20" y="166" fill="#94a3b8" font-size="10">Diagnoses &amp; Symptoms: 8</text>
    </g>

    <g transform="translate(245, 280)">
      <rect width="215" height="195" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-size="10" font-weight="600" text-transform="uppercase">Ingestion Health</text>
      <text x="20" y="70" fill="#10b981" font-size="36" font-weight="800">0%</text>
      <text x="20" y="95" fill="#e2e8f0" font-size="11" font-weight="600">Null / Missing Rate</text>
      <text x="20" y="125" fill="#94a3b8" font-size="10">Row Truncation: <tspan fill="#10b981" font-weight="bold">None</tspan></text>
      <text x="20" y="145" fill="#94a3b8" font-size="10">Encoding: <tspan fill="#38bdf8" font-weight="bold">UTF-8 / Clean</tspan></text>
      <text x="20" y="165" fill="#94a3b8" font-size="10">Ready for Analysis: <tspan fill="#10b981" font-weight="bold">Yes</tspan></text>
    </g>
  </g>
</svg>
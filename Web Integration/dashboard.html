{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

  <!-- TOP DASHBOARD CONTROLS BAR -->
  <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-lg font-bold text-white">Smart Healthcare Analytical Dashboard</h1>
      <p class="text-xs text-slate-400">Embedded via Tableau Embedding API v3 • Interactive Live Clinical Exploration</p>
    </div>

    <!-- Live URL Switcher -->
    <form action="/dashboard" method="GET" class="flex items-center gap-2">
      <input 
        type="text" 
        name="url" 
        value="{{ viz_url }}" 
        placeholder="Paste your Tableau Public URL..." 
        class="bg-slate-900 text-slate-200 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-64 md:w-80 focus:outline-none focus:border-rose-500 font-mono"
      />
      <button type="submit" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs transition-smooth">
        Load Viz
      </button>
    </form>
  </div>

  <!-- TABLEAU EMBED CONTAINER -->
  <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-2xl relative overflow-hidden">
    
    <!-- EMBEDDED TABLEAU WEB COMPONENT (Embedding API v3) -->
    <div class="w-full rounded-xl overflow-hidden shadow-inner bg-slate-950 flex flex-col items-center justify-center min-h-[750px]">
      
      <!-- Modern Tableau Embedding API v3 Web Component -->
      <tableau-viz 
        id="tableauHealthcareViz"
        src="{{ viz_url }}"
        toolbar="bottom"
        hide-tabs
        width="100%"
        height="850px"
        class="w-full">
      </tableau-viz>

      <!-- FALLBACK INTERACTIVE NOTICE IF OFFLINE -->
      <noscript>
        <div class="p-6 text-center text-slate-400 text-xs">
          Please enable JavaScript to view the embedded Tableau visualization.
        </div>
      </noscript>
    </div>

    <!-- EMBED FOOTER NOTE -->
    <div class="mt-4 pt-3 border-t border-slate-700 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-2">
      <span>Embed Method: <code>&lt;tableau-viz&gt;</code> Web Component (Tableau Embedding API v3)</span>
      <span class="text-sky-400">Directly integrated with Flask web framework</span>
    </div>
  </div>

</div>
{% endblock %}

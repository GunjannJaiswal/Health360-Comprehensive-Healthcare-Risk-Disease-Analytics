<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Smart Healthcare Clinical Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tableau Embedding API v3 (Official Web Component API) -->
  <script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
  <style>
    .transition-smooth { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- NAVBAR -->
  <nav class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-500 font-bold">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        </div>
        <div>
          <a href="/" class="text-base font-bold tracking-tight text-white hover:text-rose-400 transition-smooth">Smart Healthcare Portal</a>
          <p class="text-[10px] text-slate-400">Flask &amp; Tableau Embedded Clinical Intelligence</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-4 text-xs font-semibold">
        <a href="/" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition-smooth">Overview</a>
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition-smooth">Tableau Dashboard</a>
        <a href="/story" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition-smooth">Clinical Story</a>
        <a href="/api/summary" target="_blank" class="px-2.5 py-1 rounded bg-slate-700/50 border border-slate-600 text-sky-400 font-mono hover:bg-slate-700 transition-smooth">API</a>
      </div>
    </div>
  </nav>

  <!-- MAIN BODY CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-800 border-t border-slate-700 py-6 text-xs text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <span class="font-semibold text-slate-200">Smart Healthcare Decision Platform</span> • Embedded Tableau v3 &amp; Flask
      </div>
      <div>
        N = 5,000 Patient Cohort • 17 Clinical &amp; Lifestyle Features
      </div>
    </div>
  </footer>

</body>
</html>
